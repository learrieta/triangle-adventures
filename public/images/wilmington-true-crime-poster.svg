  </defs>

  <rect width="1200" height="1500" fill="url(#bg)"/>
  <rect width="1200" height="1500" fill="url(#grid)"/>
  <rect width="1200" height="1500" fill="url(#glow)"/>

  <path d="M0 1190c170-90 320-124 515-95 192 29 369 112 685 7v398H0z" fill="#090909" opacity="0.82"/>
  <path d="M100 1120c155-92 307-114 475-68 158 43 319 121 525 55" fill="none" stroke="#f9b717" stroke-opacity="0.38" stroke-width="6"/>
  <path d="M110 1167c177-84 321-88 491-35 136 42 283 96 490 32" fill="none" stroke="#ff833d" stroke-opacity="0.28" stroke-width="3"/>

