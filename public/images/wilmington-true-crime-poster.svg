    <text x="600" y="775" font-family="Rajdhani, Barlow, Arial, sans-serif" font-size="104" font-weight="800" fill="#ffffff" letter-spacing="-1">WILMINGTON</text>
    <text x="600" y="890" font-family="Rajdhani, Barlow, Arial, sans-serif" font-size="88" font-weight="800" fill="#ffffff" letter-spacing="-1">TRUE CRIME</text>
