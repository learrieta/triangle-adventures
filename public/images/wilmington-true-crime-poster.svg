<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">Wilmington: True Crime &amp; Weird History tour poster</title>
  <desc id="desc">Official Triangle Adventures Wilmington True Crime and Weird History tour poster artwork.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050506"/>
      <stop offset="0.48" stop-color="#12100b"/>
      <stop offset="1" stop-color="#060606"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="28%" r="60%">
