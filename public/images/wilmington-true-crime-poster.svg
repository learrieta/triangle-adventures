    <path d="M382 464c85-112 158-168 218-168s133 56 218 168" fill="none" stroke="#f9b717" stroke-width="18" stroke-linecap="round" opacity="0.92"/>
    <path d="M452 512h296" stroke="#ffffff" stroke-opacity="0.86" stroke-width="18" stroke-linecap="round"/>
    <circle cx="496" cy="584" r="46" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="16"/>
    <circle cx="704" cy="584" r="46" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="16"/>
